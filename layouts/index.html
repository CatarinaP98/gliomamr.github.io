{{ define "main" }}

<div class="hero-carousel">

    <img id="slide1"
         src="/Images/hero/main.png"
            class="hero-image active"
            loading="eager"
            alt="GliMR">

    <img id="slide2"
         src="/Images/hero/group.png"
            class="hero-image"
            fetchpriority="high"
            loading="lazy"
            alt="GliMR community">
</div>



<script>

document.addEventListener("DOMContentLoaded", function() {

    const slides = document.querySelectorAll(".hero-image");

    let current = 0;

    setInterval(() => {

        slides[current].classList.remove("active");

        current = (current + 1) % slides.length;

        slides[current].classList.add("active");

    }, 6000);

});

</script>

<div class="homepage-content">
    {{ .Content | safeHTML }}
</div>

<section class="latest-bluesky">
    <h2>Latest News from GliMR</h2>
<div id="bluesky-feed" class="bluesky-grid">
</div>

    <p>
<div class="bluesky-footer">
 <a class="bluesky-button"
   href="https://bsky.app/profile/glimr-eu.bsky.social"
   target="_blank">

    <svg xmlns="http://www.w3.org/2000/svg"
         width="18"
         height="18"
         viewBox="0 0 600 530"
         fill="currentColor">
        <path d="M135.72 44.03c67.31 50.58 139.72 153.15 164.28 203.92
        24.56-50.77 96.97-153.34 164.28-203.92
        48.6-36.52 127.25-64.74 127.25 25.1

        -20.98 75.02-97.45 94.13-165.49 82.54
        118.95 20.26 149.22 87.34 83.87 154.42
        -124.15 127.46-178.42-31.98-192.33-72.83
        -2.55-7.49-3.74-11.0-4.99-11.0

        -13.91 40.85-68.18 200.29-192.33 72.83
        -65.35-67.08-35.08-134.16 83.87-154.42

        0-89.84 78.65-61.62 127.25-25.1z"/>
    </svg>

    <span>Follow GliMR on Bluesky</span>

</a>
</div>
</section>

<script>

fetch('https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=glimr-eu.bsky.social&limit=20')
  .then(response => response.json())
  .then(data => {

    const container = document.getElementById('bluesky-feed');

    container.innerHTML = '';

    let count = 0;

    data.feed.forEach(item => {

        if (count >= 3) {
            return;
        }

        const fullText = item.post.record.text;

        if (/\b(?!1\/)\d+\/\d+\b/.test(fullText)) {
            return;
        }

        count++;

        const text = fullText
            .replace(/^\s*[^A-Za-z0-9]*1\/\d+\s*/, '')
            .substring(0,180) + '..*';
            
            let imageHtml = '';
                if (
                    item.post.embed &&
                    item.post.embed.$type === 'app.bsky.embed.images#view'
                    ) {
                imageHtml = `
                        <img
                        src="${item.post.embed.images[0].thumb}"
                        style="
                            width:100%;
                            height:350px;
                            object-fit:contain;
                            border-radius:8px;
                            margin-bottom:12px;
                        "
                        >
                        `;
                    }

      const date = new Date(item.post.record.createdAt)
        .toLocaleDateString('en-GB', {
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        });

      const card = document.createElement('a');
        card.className = 'bluesky-card';
        card.href = `https://bsky.app/profile/${item.post.author.handle}/post/${item.post.uri.split('/').pop()}`;
        card.target = '_blank';
        card.style.textDecoration = 'none';
        card.style.color = 'inherit';
        card.innerHTML = `
             ${imageHtml}
              <p>${text}</p>
            <p style="
            margin-top:auto;
            font-size:0.85rem;
            color:#d85c48;
                ">
                    ${date}
                </p>
                        `;

      container.appendChild(card);

    });

  });

</script>

{{ end }}
